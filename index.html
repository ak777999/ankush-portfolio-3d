<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ANKUSH — Digital Designer &amp; Creator</title>
<meta name="description" content="Ankush — digital designer and creator based in Ludhiana. Immersive 3D portfolio.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27black%27/%3E%3Ctext x=%2716%27 y=%2724%27 font-size=%2722%27 text-anchor=%27middle%27 fill=%27%2300ddff%27 font-family=%27Arial%27 font-weight=%27bold%27%3EA%3C/text%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/Oswald-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/JetBrainsMono-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css">
<script type="importmap">
{ "imports": {
  "three": "./assets/vendor/three/build/three.module.min.js",
  "three/addons/": "./assets/vendor/three/addons/"
} }
</script>
<script src="assets/content.js"></script>
<script src="assets/vendor/gsap.min.js"></script>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="flash"></div>

<div id="loader" role="status" aria-live="polite">
  <div class="ld-inner">
    <div class="ld-word">LOADING</div>
    <div class="ld-bar"><i></i></div>
    <div class="ld-pct mono"><span id="ldPct">0</span>%</div>
  </div>
</div>

<header class="ui-top">
  <a href="#" class="logo" id="logo" data-hover></a>
  <nav class="top-right">
    <a href="#contact" class="btn-talk" id="talkBtn" data-hover>LET'S TALK</a>
    <button class="btn-sound" id="soundBtn" aria-pressed="false" data-hover>SOUND <b>OFF</b></button>
  </nav>
</header>

<main id="overlays">
  <section class="ov ov-hero" data-s="0">
    <div class="hero-text">
      <h1 id="heroLine"></h1>
      <p class="mono small dim" id="heroNote"></p>
    </div>
    <div class="scroll-hint mono" id="scrollHint"></div>
  </section>

  <section class="ov ov-work" data-s="1">
    <div class="work-left">
      <h2 id="workTitle"></h2>
      <p class="mono" id="workHint"></p>
    </div>
    <div class="work-current mono">
      <span class="wc-num" id="wcNum">01 / 05</span>
      <span class="wc-title" id="wcTitle"></span>
      <span class="wc-meta dim" id="wcMeta"></span>
    </div>
  </section>

  <section class="ov ov-about" data-s="2">
    <div class="terminal mono" id="terminal">
      <div class="term-head"><i></i><i></i><i></i><span>ankush@ludhiana:~</span></div>
      <div class="term-body" id="termBody"></div>
      <a href="#" class="term-more" id="learnMore" data-hover></a>
    </div>
  </section>

  <section class="ov ov-city" data-s="3">
    <div class="city-text">
      <p class="mono kicker" id="cityKicker"></p>
      <h2 id="cityLine"></h2>
    </div>
  </section>

  <section class="ov ov-contact" data-s="4" id="contact">
    <div class="contact-center">
      <h2 id="contactTitle"></h2>
      <a class="btn-contact" id="contactBtn" data-hover><span></span></a>
      <p class="mono small" id="contactMail"></p>
    </div>
    <a href="#" class="foot-left mono" id="privacyBtn" data-hover>PRIVACY POLICY</a>
    <div class="foot-right mono" id="footer"></div>
  </section>
</main>

<div class="hud mono" aria-hidden="true">
  <span id="hudIdx">01</span><span class="hud-line"><i id="hudFill"></i></span><span id="hudName">HERO</span>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" hidden>
  <div class="modal-box mono">
    <button class="modal-x" id="modalX" data-hover aria-label="Close">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<div id="cursor" aria-hidden="true"></div>
<noscript><p style="color:#fff;padding:40px;font-family:sans-serif">Is website ke liye JavaScript on karo.</p></noscript>
<script type="module" src="assets/app.js"></script>
</body>
</html>
